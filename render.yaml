# Render.com blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then on Render: New -> Blueprint and
# point it at the repo. Nothing to configure; there are no secrets.
#
# This serves the page that ./daily.sh builds. The model itself is NOT
# rebuilt here: the pipeline needs a 144 MB SQLite database that cannot be
# committed, so the built page is the deploy artifact. Refresh with
# ./publish.sh, which rebuilds locally and pushes; Render redeploys on push.
services:
  - type: web
    name: nhl-daily-predictions
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn app:app --worker-class gthread --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Scores move minute to minute, prices drift over hours, so they are
      # refreshed on separate clocks. Both are lazy: the first request after
      # the interval pays for the refresh and the rest are served the cache.
      # The score interval is a floor on how often the league's API is
      # called, not a cache the reader is stuck behind: the page itself is
      # sent with no-cache and an ETag, so every reload reaches the server,
      # and ?refresh=1 skips the floor entirely.
      - key: NHL_SCORE_TTL
        value: "60"
      - key: NHL_ODDS_TTL
        value: "900"
