<meta charset="utf-8">
<title>NHL Daily Predictions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* A slate is a departure board.
   Fixed columns that never move, rows ranked by edge, and a price that has
   changed since you last looked keeps its lamp until you have seen it.
   The board is vitreous navy enamel with cream lettering, the way an airport
   sign was before it was a screen, whatever the page's theme around it.
   Division is a hairline seam, never a card shadow.

   Barlow Condensed for board rows and display, Barlow for prose, Azeret
   Mono uppercase for every column label, status word and code.

   One saturated colour, vermilion, and it carries the negative: the miss,
   the losing edge, the situation measured to lose. On a page whose honest
   message is that most of these bets lose, that is the signal worth the
   ink. The lamp is cream at full brightness instead, which on navy is the
   loudest thing available and collides with nothing. */
:root {
  color-scheme: light;
  /* page */
  --bg: #e5e6e2; --surface: #f8f8f6; --surface2: #eeefeb;
  --fg: #141b26; --muted: #49515f; --faint: #5d6574;
  --seam: #c7c9c3; --seam2: #dcded8;
  /* the board: vitreous navy enamel in both themes */
  --board: #16243d; --board2: #1d2e4b; --board3: #273b5c;
  --board-row: #1b2c48; --board-seam: #31466a;
  --board-fg: #f0ead8; --board-mut: #9aa6bb; --board-faint: #848fa8;
  /* the lamp is cream at full brightness; it marks change, not danger */
  --lamp: #fff7e2; --alert-ink: #16243d;
  /* one saturated colour, and it carries the negative */
  --alert: #e8502a; --alert-soft: #fae7df;
  --good: #1d6b4f; --good-soft: #e2efe8;
  --bad: #a93718; --bad-soft: #fae7df;
  --board-good: #63b894; --board-bad: #f2765a;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --sans: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Azeret Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 2px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1520; --surface: #161d2b; --surface2: #1a2232;
    --fg: #e9e6dc; --muted: #9aa4b6; --faint: #8591a6;
    --seam: #2a3448; --seam2: #1f283a;
    --alert-soft: #371a10;
    --good: #63b894; --good-soft: #10281f;
    --bad: #f2765a; --bad-soft: #371a10;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1520; --surface: #161d2b; --surface2: #1a2232;
  --fg: #e9e6dc; --muted: #9aa4b6; --faint: #8591a6;
  --seam: #2a3448; --seam2: #1f283a;
  --alert-soft: #371a10;
  --good: #63b894; --good-soft: #10281f;
  --bad: #f2765a; --bad-soft: #371a10;
}
* { box-sizing: border-box; }
/* A class that sets `display` beats the browser's own [hidden] rule, so
   .goalies{display:flex} was showing a hidden block. */
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale; }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: 20px;
  padding-block: 0 64px; }
h1, h2, h3, h4 { margin: 0; font-family: var(--cond); font-weight: 700;
  text-transform: uppercase; letter-spacing: .01em; }
p { margin: 0; }
input, select, button { font: inherit; color: inherit; }
button { cursor: pointer; }
/* The surfaces the browser draws are part of the design. */
::selection { background: var(--board); color: var(--board-fg); }
:focus-visible { outline: 2px solid var(--alert); outline-offset: 2px; }
input { caret-color: var(--alert); }
* { scrollbar-width: thin; scrollbar-color: var(--seam) transparent; }
*::-webkit-scrollbar { height: 9px; width: 9px; }
*::-webkit-scrollbar-thumb { background: var(--seam); }
*::-webkit-scrollbar-track { background: transparent; }

/* mono labels: the board's own voice */
.lbl, .stat .k, .goalie .k, .ptable thead th, .prices h4, .lf .k, .day .dw,
.top .stamp, .striphead .lmuted, .badge, .chip, .side, .flag, .score .ot {
  font-family: var(--mono); font-weight: 500; text-transform: uppercase;
  letter-spacing: .1em; font-size: 9.5px; }
.num, .ptable .num, .stat .v, .record .big, .lf, .vs, .score, .day .dd {
  font-variant-numeric: tabular-nums lining-nums; }

/* ---------- masthead: one ink strip across the top ---------- */
.masthead { background: var(--board); color: var(--board-fg);
  border-bottom: 3px solid var(--alert); padding-inline: 20px; }
.top { display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap;
  padding: 13px 0; max-width: 1200px; margin-inline: auto; }
.top h1 { font-size: 23px; font-weight: 700; letter-spacing: .035em;
  line-height: 1; }
.top .stamp { color: var(--board-mut); font-size: 9.5px; }
.top .seasonrec { margin-left: auto; display: flex; align-items: baseline;
  gap: 9px; }
.top .seasonrec b { font-family: var(--cond); font-size: 26px; font-weight: 700;
  line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.top .seasonrec span { font-family: var(--mono); font-size: 9.5px;
  text-transform: uppercase; letter-spacing: .1em; color: var(--board-mut); }
.intro { color: var(--muted); font-size: 14px; max-width: 74ch;
  padding: 16px 0 0; }

/* ---------- day register: one ruled strip of fixed cells ---------- */
.days { display: flex; overflow-x: auto; margin: 16px 0 0;
  border: 1px solid var(--seam); background: var(--surface);
  scroll-padding-inline: 90px; }
.day { flex: 1 0 86px; padding: 7px 6px 8px; text-align: center;
  line-height: 1.2; border-right: 1px solid var(--seam2); background: none;
  border-top: 0; border-bottom: 0; border-left: 0; }
.day:last-child { border-right: 0; }
.day .dw { display: block; color: var(--muted); }
.day .dd { display: block; font-family: var(--cond); font-size: 19px;
  font-weight: 600; letter-spacing: .02em; }
.day .dn { display: block; font-family: var(--mono); font-size: 9px;
  color: var(--faint); letter-spacing: .04em; }
.day:hover { background: var(--surface2); }
.day[aria-pressed=true] { background: var(--board); color: var(--board-fg); }
.day[aria-pressed=true] .dw, .day[aria-pressed=true] .dn { color: var(--board-mut); }
.day.past { background: var(--surface2); }
.day.past[aria-pressed=true] { background: var(--board); }
.day.hit .dn { color: var(--good); }
.day.miss .dn { color: var(--bad); }
.day .dn.livecount { color: var(--bad); }
.daysep { flex: 0 0 3px; background: var(--seam); align-self: stretch; }

.daybar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 16px 0 10px; }
.daybar h2 { font-size: 20px; letter-spacing: .03em; }
.daybar .cnt { font-family: var(--mono); text-transform: uppercase;
  letter-spacing: .1em; font-size: 9.5px; color: var(--muted);
  margin-left: 2px; }
.toggle { margin-left: auto; display: inline-flex; align-items: center;
  gap: 8px; font-family: var(--mono); font-size: 9.5px; text-transform: uppercase;
  letter-spacing: .1em; color: var(--muted); background: var(--surface);
  border: 1px solid var(--seam); padding: 7px 11px; cursor: pointer; }
.toggle:hover { border-color: var(--fg); color: var(--fg); }
.toggle input { margin: 0; accent-color: var(--alert); }

/* ---------- the record, as a figure set and not a tile ---------- */
.record { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 9px 0 11px; border-top: 1px solid var(--seam);
  border-bottom: 1px solid var(--seam); font-size: 13px; color: var(--muted); }
.record .big { font-family: var(--cond); font-size: 21px; font-weight: 700;
  color: var(--fg); letter-spacing: .02em; }
.record .sep { color: var(--seam); }

/* ---------- THE BOARD ---------- */
.strip { margin: 20px 0 0; }
.striphead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 7px; }
.striphead h3 { font-size: 17px; letter-spacing: .04em; }
.lmuted { color: var(--faint); font-size: 12px; }
.striphead .lmuted { font-size: 9.5px; }
.strip .pwrap { border: 1px solid var(--board-seam); }
.strip .ptable { background: var(--board); color: var(--board-fg);
  width: 100%; border-collapse: collapse; }
.strip .ptable thead th { background: var(--board2); color: var(--board-mut);
  border-bottom: 1px solid var(--board-seam); padding: 8px 10px;
  text-align: right; white-space: nowrap; }
.strip .ptable thead th:nth-child(-n+3) { text-align: left; }
.strip .ptable td { padding: 9px 10px; text-align: right; white-space: nowrap;
  border-bottom: 1px solid var(--board-seam); font-family: var(--cond);
  font-size: 16px; font-weight: 500; letter-spacing: .02em;
  font-variant-numeric: tabular-nums lining-nums; }
.strip .ptable td:nth-child(-n+3) { text-align: left; }
.strip .ptable tbody tr:last-child td { border-bottom: 0; }
.strip .ptable .pname { font-weight: 600; text-transform: uppercase;
  letter-spacing: .03em; }
.strip tbody tr.val td { background: var(--board-row); }
.strip tbody tr.jump { cursor: pointer; }
.strip tbody tr.jump:hover td { background: var(--board3); }
.strip .gl { color: var(--board-mut); text-decoration: none;
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em; }
.strip tbody tr.jump:hover .gl { color: var(--lamp); }
.jumpmark { color: var(--board-faint); padding-left: 5px;
  display: inline-flex; vertical-align: -2px; }
.strip tbody tr.jump:hover .jumpmark { color: var(--lamp); }
.strip .pos { color: var(--board-good); }
.strip .neg { color: var(--board-bad); }
.strip .zero { color: var(--board-mut); }
.strip .badge { margin-right: 7px; background: var(--board-fg);
  color: var(--board); }
.strip td.status { font-family: var(--mono); font-weight: 600; font-size: 9.5px;
  text-transform: uppercase; letter-spacing: .1em; }
.strip td.status.st-bad { color: var(--board-bad); }
.strip td.status.st-none { color: var(--board-faint); }
.strip td.status.st-open { color: var(--board-fg); }
/* the same verdict, carried under the pick where there is no column for it */
.st-inline { display: none; font-family: var(--mono); font-weight: 600;
  font-size: 9px; text-transform: uppercase; letter-spacing: .08em;
  margin-top: 2px; }
.st-inline.st-bad { color: var(--board-bad); }
.st-inline.st-none { color: var(--board-faint); }
.st-inline.st-open { color: var(--board-mut); }
.strip .lwhy { color: var(--muted); }

/* the lamp: its own fixed cell, lit until this viewer has seen the change */
.lampcell { width: 16px; padding-right: 0 !important; }
.lamp { display: block; width: 7px; height: 7px; background: var(--lamp);
  box-shadow: 0 0 8px 2px rgba(255, 247, 226, .5); }
.lampcell .was { display: none; }
tr.moved .gl { color: var(--lamp); }
.pricecell .was { font-family: var(--mono); font-size: 9.5px;
  color: var(--board-faint); text-decoration: line-through;
  margin-right: 6px; letter-spacing: .04em; }
tr.moved .pricecell b { background: var(--lamp); color: var(--board);
  font-weight: 700; padding: 1px 5px; }

/* the one authored moment: rows settle into their new rank */
@media (prefers-reduced-motion: no-preference) {
  .strip tbody tr { transition: transform .42s cubic-bezier(.16, 1, .3, 1); }
  .strip tbody tr.flip { transition: none; }
}

/* ---------- generic tables (props, saves, past) ---------- */
.pwrap { overflow-x: auto; }
/* A scrollable table announces itself rather than ending in mid-air. */
.pwrap { position: relative; }
.scrollhint { display: none; font-family: var(--mono); font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em; font-size: 10px;
  color: var(--faint); padding: 5px 2px 0; }
.pwrap.over + .scrollhint { display: block; }
.ptable { width: 100%; border-collapse: collapse; }
.ptable th, .ptable td { padding: 6px 9px; text-align: right; white-space: nowrap;
  border-bottom: 1px solid var(--seam2); font-size: 13px; }
.ptable th:first-child, .ptable td:first-child { text-align: left; }
.ptable thead th { color: var(--muted); border-bottom: 1px solid var(--seam); }
.ptable tbody tr:last-child td { border-bottom: 0; }
.ptable .num { font-family: var(--cond); font-size: 15px; font-weight: 500;
  letter-spacing: .02em; }
.ptable .pname { font-weight: 500; }
.ptable tbody tr:hover td { background: var(--surface2); }
.badge { color: var(--bg); background: var(--fg); padding: 1px 4px;
  margin-right: 6px; }
.bet { white-space: nowrap; }
.side { display: inline-block; padding: 2px 5px; margin-right: 6px;
  vertical-align: 1px; font-size: 9px; }
.side-u { background: var(--board); color: var(--board-fg); }
.side-o { background: var(--good); color: #fff; }
/* inside the board the row is already navy, so the under chip needs the
   inverse or it stops being a chip at all */
.strip .side-u { background: var(--board-fg); color: var(--board); }

/* ---------- game cards: panels divided by seams, not shadows ---------- */
.game { background: var(--surface); border: 1px solid var(--seam);
  margin-top: -1px; padding: 15px 17px; scroll-margin-top: 14px; }
.game:first-of-type { margin-top: 0; }
@keyframes land { from { background: var(--surface2); } to { background: var(--surface); } }
.game.land { animation: land 1.5s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .game.land { animation: none; outline: 2px solid var(--board); }
}
.ghead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin-bottom: 10px; }
.ghead .matchup { font-family: var(--cond); font-size: 20px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .03em; }
.ghead .matchup .at { color: var(--faint); font-weight: 500; margin: 0 5px;
  text-transform: none; letter-spacing: 0; font-family: var(--sans);
  font-size: 14px; }
.ghead .pick { margin-left: auto; font-size: 13px; color: var(--muted); }
.ghead .pick b { color: var(--fg); font-weight: 600; }

.split { margin-bottom: 4px; }
.splitlabels { display: flex; justify-content: space-between; font-size: 13px;
  margin-bottom: 4px; }
.splitlabels .t { font-weight: 500; }
.splitlabels .p { font-family: var(--cond); font-size: 16px; font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.bar { display: flex; height: 8px; background: var(--seam2); }
.bar i { display: block; height: 100%; }
.bar .ia { background: var(--faint); }
.bar .ih { background: var(--fg); }
.readout { font-size: 12px; color: var(--faint); margin-top: 6px; }

/* the segmented pass: labelled cells divided by seams */
.stats { display: flex; flex-wrap: wrap; margin-top: 13px;
  border: 1px solid var(--seam); background: var(--surface2); }
.stat { flex: 1 1 128px; padding: 7px 11px; border-right: 1px solid var(--seam); }
.stat:last-child { border-right: 0; }
.stat .k { display: block; color: var(--muted); }
.stat .v { display: block; font-family: var(--cond); font-size: 20px;
  font-weight: 600; letter-spacing: .02em; margin-top: 1px; }
.stat .n { display: block; font-size: 11px; color: var(--faint); }

.goalies { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px;
  font-size: 13px; }
.goalie .k { display: block; color: var(--muted); }
.goalie .v { font-weight: 500; }
.flag { display: inline-block; padding: 1px 5px; margin-left: 5px;
  background: var(--board); color: var(--board-fg); vertical-align: 1px; }

details.props { margin-top: 12px; border-top: 1px solid var(--seam2);
  padding-top: 10px; }
details.props summary { font-family: var(--mono); font-size: 9.5px;
  text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
  cursor: pointer; list-style: none; display: flex; align-items: center;
  gap: 7px; }
details.props summary::-webkit-details-marker { display: none; }
details.props summary:hover { color: var(--fg); }
.caret { flex: none; transition: transform .18s ease; }
details[open] > summary .caret { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }

/* ---------- odds mode ---------- */
.prices { margin-top: 12px; border-top: 1px solid var(--seam2); padding-top: 10px; }
.prices h4 { margin: 0 0 8px; color: var(--muted); }
.ptable .odds-in, .prices .odds-in { width: 68px; background: var(--surface);
  border: 1px solid var(--seam); padding: 4px 7px; font-family: var(--mono);
  font-size: 12px; text-align: right; }
.prices .odds-in.has, .ptable .odds-in.has { border-color: var(--fg);
  box-shadow: inset 0 -2px 0 var(--fg); }
.chip { display: inline-block; padding: 2px 6px; border: 1px solid currentColor; }
.chip-play { color: var(--good); background: var(--good-soft); }
.chip-thin { color: var(--muted); }
.chip-skip { color: var(--bad); background: var(--bad-soft); }
.chip-none { color: var(--faint); border-color: transparent; }
.strip .chip-play { color: var(--board-good); background: transparent; }
.strip .chip-thin { color: var(--board-mut); }
.strip .chip-skip { color: var(--board-bad); background: transparent; }
.strip .chip-none { color: var(--board-faint); border-color: transparent; }
.pos { color: var(--good); } .neg { color: var(--bad); } .zero { color: var(--faint); }
.oddsctl { display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  background: var(--surface); border: 1px solid var(--seam); padding: 10px 13px;
  margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.oddsctl input[type=number] { width: 80px; background: var(--surface);
  border: 1px solid var(--seam); padding: 4px 7px; font-family: var(--mono);
  font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--seam); background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 5px 11px;
  font-family: var(--mono); font-size: 9.5px; text-transform: uppercase;
  letter-spacing: .1em; color: var(--muted); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed=true] { background: var(--board); color: var(--board-fg); }
.striphead .seg { background: var(--surface); }

/* ---------- notes ---------- */
.note { display: flex; gap: 10px; padding: 10px 13px; font-size: 13px;
  line-height: 1.5; margin-bottom: 14px; border: 1px solid var(--seam);
  background: var(--surface); }
.note b { font-weight: 600; }
.note .ic { flex: none; display: inline-flex; margin-top: 1px; }
.note-bad { background: var(--bad-soft); border-color: var(--bad); }
.note-bad .ic { color: var(--bad); }
.note-info { background: var(--surface2); border-color: var(--board); }
.note-info .ic { color: var(--muted); }

/* ---------- measured-record disclosure ---------- */
.evidence { border: 1px solid var(--seam); background: var(--surface);
  margin-bottom: 14px; }
.evidence > summary { list-style: none; cursor: pointer; padding: 10px 14px;
  display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
.evidence > summary::-webkit-details-marker { display: none; }
.evidence > summary::after { content: "SHOW"; margin-left: auto;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
  color: var(--muted); }
.evidence[open] > summary::after { content: "HIDE"; }
.evidence > summary:hover::after { color: var(--fg); }
.ehead { font-family: var(--cond); font-size: 16px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .03em; }
.esum { font-size: 13px; color: var(--muted); }
.evidence .pwrap { padding: 0 14px; }
.evidence .lwhy { padding: 0 14px 12px; margin: 8px 0 0; }
.evidence .erow td { border-top: 1px solid var(--seam);
  border-bottom: 0; font-weight: 600; }

/* ---------- posted line inside a game card ---------- */
.line { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--seam2);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; }
.lf { display: inline-flex; align-items: baseline; gap: 6px;
  font-family: var(--cond); font-size: 15px; font-weight: 500;
  letter-spacing: .02em; }
.lf .k { font-style: normal; color: var(--muted); }
.lf b { font-weight: 600; }
.lf.pos b { color: var(--good); }
.lf.neg b { color: var(--bad); }
.line .chip { margin-left: auto; }
.lwhy { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin: 8px 0 0; }

/* ---------- finished games ---------- */
.chip-live { color: var(--bad); border-color: var(--bad); }
.res { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
.res .chip-hit { color: var(--good); background: var(--good-soft); }
.res .chip-miss { color: var(--bad); background: var(--bad-soft); }
.score { display: flex; align-items: baseline; gap: 11px; font-family: var(--cond);
  font-size: 30px; font-weight: 700; margin: 3px 0 11px; letter-spacing: .02em; }
.score .ot { background: var(--board); color: var(--board-fg); padding: 2px 5px;
  align-self: center; }
.score .wl { color: var(--faint); font-weight: 500; }
.score .win { color: var(--fg); }
.vs { font-family: var(--cond); font-size: 15px; letter-spacing: .02em; }
.vs .arrow { color: var(--faint); margin: 0 4px; }
.vs .act { font-weight: 700; }
.ptable .hitmark { font-family: var(--cond); font-weight: 700; font-size: 15px; }

/* ---------- limits and foot ---------- */
details.limits { margin-top: 28px; background: var(--surface);
  border: 1px solid var(--seam); padding: 13px 16px; }
details.limits summary { font-family: var(--cond); font-size: 17px;
